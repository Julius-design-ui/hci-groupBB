
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Reminders | Hope Hospital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Figtree',sans-serif}
body{background:#f7f4fc;color:#29243a}
.sidebar{width:245px;height:100vh;position:fixed;background:white;padding:28px 18px;border-right:1px solid #eee8f7}
.logo{font-size:24px;font-weight:700;color:#7446d8;margin-bottom:32px}
.logo span{color:#29243a}
.sidebar a{display:block;text-decoration:none;color:#696477;padding:13px 14px;margin:6px 0;border-radius:10px}
.sidebar a:hover,.sidebar a.active{background:#eee7fc;color:#7446d8}
.main{margin-left:245px;padding:35px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.header h1{font-size:28px}
.doctor-tag{background:white;padding:12px 18px;border-radius:12px;color:#7446d8;font-weight:600}
.banner{background:linear-gradient(120deg,#7446d8,#a78bfa);color:white;padding:25px;border-radius:16px;margin-bottom:25px}
.banner h2{margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:25px}
.card{background:white;padding:22px;border-radius:15px;box-shadow:0 4px 15px #e9e2f5}
.card p{color:#777185;margin-bottom:10px}
.card h2{font-size:28px;color:#7446d8}
.section{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px #e9e2f5}
.section h2{margin-bottom:20px}
.reminder{padding:18px;background:#f7f4fc;border-left:4px solid #7446d8;border-radius:9px;margin-bottom:15px}
.reminder h3{margin-bottom:8px;font-size:17px}
.reminder p{color:#777185;margin:5px 0;font-size:14px}
.empty{text-align:center;padding:25px;color:#888}
@media(max-width:900px){.sidebar{width:190px}.main{margin-left:190px;padding:20px}}
@media(max-width:560px){.sidebar{position:relative;width:100%;height:auto}.sidebar a{display:inline-block}.main{margin-left:0}.cards{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">Hope <span>Hospital</span></div>
<a href="doctor-home.html">Dashboard</a>
<a href="doctor-appointments.html">My Appointments</a>
<a href="doctor-patients.html">My Patients</a>
<a href="staff-schedule2.html">My Schedule</a>
<a href="doctor-reminders.html" class="active">Reminders</a>
<a href="doctor-profile.html">My Profile</a>
<a href="signin.html" onclick="signOut()">Sign Out</a>
</div>

<div class="main">

<div class="header">
<h1>Appointment Reminders</h1>
<div class="doctor-tag">Dr. <span id="doctorName">Doctor</span></div>
</div>

<div class="banner">
<h2>Stay Updated</h2>
<p>Keep track of upcoming consultations and patient appointments.</p>
</div>

<div class="cards">
<div class="card">
<p>Upcoming Appointments</p>
<h2 id="upcomingCount">0</h2>
</div>

<div class="card">
<p>Today's Consultations</p>
<h2 id="todayCount">0</h2>
</div>
</div>

<div class="section">
<h2>Upcoming Reminders</h2>
<div id="reminderList"></div>
</div>

</div>

<script>
let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

let user = localStorage.getItem("loggedInUser") || "Doctor";

try {
    user = JSON.parse(user);
} catch(e) {
    user = {name:user};
}

let doctorName = user.name || user.fullName || user.username || "Doctor";
let doctorEmail = (user.email || "").toLowerCase();

document.getElementById("doctorName").textContent = doctorName;

function getDoctorAppointments() {
    return appointments.filter(a => {
        let name = (a.doctor || a.doctorName || a.selectedDoctor || "").toLowerCase();
        let email = (a.doctorEmail || "").toLowerCase();

        return name === doctorName.toLowerCase() ||
               (doctorEmail && email === doctorEmail);
    });
}

function displayReminders() {
    let list = getDoctorAppointments();

    let today = new Date().toISOString().split("T")[0];

    let upcoming = list.filter(a =>
        a.date >= today &&
        a.status !== "Cancelled" &&
        a.status !== "Completed"
    );

    let todayAppointments = upcoming.filter(a => a.date === today);

    document.getElementById("upcomingCount").textContent = upcoming.length;
    document.getElementById("todayCount").textContent = todayAppointments.length;

    upcoming.sort((a,b) =>
        (a.date + a.time).localeCompare(b.date + b.time)
    );

    let container = document.getElementById("reminderList");

    if (upcoming.length === 0) {
        container.innerHTML = `
        <div class="empty">You have no upcoming appointment reminders.</div>`;
        return;
    }

    container.innerHTML = upcoming.map(a => `
        <div class="reminder">
            <h3>Upcoming Consultation</h3>
            <p><b>Patient:</b> ${a.patient || a.patientName || "Patient"}</p>
            <p><b>Date:</b> ${a.date || "Not specified"}</p>
            <p><b>Time:</b> ${a.time || "Not specified"}</p>
            <p><b>Reason:</b> ${a.reason || "Consultation"}</p>
            <p><b>Status:</b> ${a.status || "Pending"}</p>
        </div>
    `).join("");
}

function signOut() {
    localStorage.removeItem("loggedInUser");
    localStorage.removeItem("currentUser");
}

displayReminders();
</script>

</body>
</html>
